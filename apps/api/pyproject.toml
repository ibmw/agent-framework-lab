[project]
name = "agent-lab-api"
version = "0.1.0"
description = "Backend foundations for the Agent Framework Capability Lab"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4,<2",
  # The lab stores exactly one secret, and stores it encrypted (ADR 0052).
  "cryptography>=45,<51",
  "fastapi>=0.116.1,<1",
  "openai-agents>=0.22,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.10.1,<3",
  # `POST /api/v1/shops/{shop_id}/media` reads a multipart upload (ADR 0076); FastAPI's
  # `request.form()` needs it, and nothing else in the API does.
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capability_lab"]
