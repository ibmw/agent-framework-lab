components:
  schemas:
    AccountFactsSchema:
      properties:
        customer_since:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Customer Since
        status:
          $ref: '#/components/schemas/AccountStatus'
        loyalty_tier:
          $ref: '#/components/schemas/LoyaltyTier'
        marketing_opt_in:
          type: boolean
          title: Marketing Opt In
        notes:
          type: string
          maxLength: 4000
          title: Notes
      additionalProperties: false
      type: object
      required:
      - customer_since
      - status
      - loyalty_tier
      - marketing_opt_in
      - notes
      title: AccountFactsSchema
    AccountStatus:
      type: string
      enum:
      - active
      - dormant
      - closed
      title: AccountStatus
    ActionProposalResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        action_type:
          type: string
          const: cancel_order
          title: Action Type
        tool_name:
          type: string
          const: cancel_order
          title: Tool Name
        tool_version:
          type: string
          const: v1
          title: Tool Version
        order_id:
          type: string
          format: uuid
          title: Order Id
        expected_version:
          type: integer
          title: Expected Version
        summary:
          type: string
          title: Summary
        confirmation_token:
          type: string
          title: Confirmation Token
        status:
          type: string
          enum:
          - proposed
          - confirmed
          - cancelled
          - executed
          title: Status
        attempts:
          type: integer
          title: Attempts
        result_order_status:
          anyOf:
          - type: string
            const: cancelled
          - type: 'null'
          title: Result Order Status
        result_order_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Result Order Version
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - action_type
      - tool_name
      - tool_version
      - order_id
      - expected_version
      - summary
      - confirmation_token
      - status
      - attempts
      - result_order_status
      - result_order_version
      title: ActionProposalResponse
    AddressSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        line1:
          type: string
          maxLength: 200
          minLength: 1
          title: Line1
        line2:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Line2
        postal_code:
          type: string
          maxLength: 200
          minLength: 1
          title: Postal Code
        city:
          type: string
          maxLength: 200
          minLength: 1
          title: City
        region:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Region
        country:
          type: string
          pattern: ^[A-Z]{2}$
          title: Country
        is_default:
          type: boolean
          title: Is Default
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - recipient
      - line1
      - line2
      - postal_code
      - city
      - region
      - country
      - is_default
      title: AddressSchema
    AgentFrameworkListResponse:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/AgentFrameworkResponse'
          type: array
          title: Frameworks
      additionalProperties: false
      type: object
      required:
