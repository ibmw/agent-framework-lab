      - model_id
      - sandbox_id
      - revision
      - snapshot_fingerprint
      - state_fingerprint
      - standing
      - metrics
      - state_diff
      title: ExperimentRunSchema
      description: 'One arm: what it runs, where it works, how far its world has moved,
        and what next.


        The two fingerprints are the arm''s own, read off the sandbox rather than
        restated:

        `snapshot_fingerprint` is where it started and agrees with every sibling arm
        forever;

        `state_fingerprint` is where it is now and stops agreeing the moment something
        writes.

        `state_diff` is what that second fingerprint moved *to*, field by field: the
        fingerprint

        says an arm''s world is not the one it started in, and the diff says what
        about it is not.'
    ExperimentStatus:
      type: string
      enum:
      - running
      - completed
      - failed
      title: ExperimentStatus
      description: 'Where a whole experiment stands, out of what each of its arms
        says.


        A fourth reading of the same record, at the width a listing needs: an operator
        scanning

        history is asking "is there anything left to do here, and did it end badly",
        which is a

        question about the experiment rather than about one arm.


        Three values because two readings decide it, and they decide different things.
        Whether

        anything can still happen is the arms'' standing (ADR 0029) — an experiment
        is running

        while any arm can still be advanced or written to. Whether what happened was
        a failure is

        the evaluation''s, and it is already defined: an arm fails when a *required*
        objective is

        missed (ADR 0030), never when the lab could not decide a row.'
