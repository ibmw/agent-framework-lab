          additionalProperties: true
          type: object
          title: Result
      additionalProperties: false
      type: object
      required:
      - tool_name
      - tool_version
      - outcome
      - result
      title: ToolActivityResponse
    ToolActorSchema:
      properties:
        support_identity_id:
          type: string
          format: uuid
