      - currency
      - recorded_on
      title: EstimatedCostSchema
      description: 'What the lab''s declared rates say one arm''s usage was worth.


        `amount` is a decimal string rather than a number, for the reason money is
        everywhere

        else in this contract: a binary float cannot hold a rate exactly, and a cost
        a client

        re-renders must be the cost the lab computed.


        `recorded_on` is when the rate behind this amount was read off the provider''s
        public

        pricing. It travels because an estimate whose age is invisible is a number
        an operator

        cannot weigh — and because a client cannot look it up: the table is the lab''s.'
