      title: BoundMutationSchema
      description: One mutation template bound to this shop's objects. Its moment
        is a binding.
    BoundObjectiveSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        block_id:
          type: string
          format: uuid
          title: Block Id
        severity:
          $ref: '#/components/schemas/ObjectiveSeverity'
        bindings:
          items:
            $ref: '#/components/schemas/ScenarioBindingSchema'
          type: array
          maxItems: 8
          title: Bindings
      additionalProperties: false
      type: object
      required:
