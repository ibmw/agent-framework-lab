            one shop.
        customer_profile_id:
          type: string
          format: uuid
          title: Customer Profile Id
        placed_at:
          type: string
          format: date-time
          title: Placed At
          description: RFC 3339 instant with an explicit UTC offset.
      additionalProperties: false
      type: object
      required:
      - reference
      - customer_profile_id
      - placed_at
      title: CreateOrderRequest
      description: 'The order''s identity: a reference, the customer it belongs to,
