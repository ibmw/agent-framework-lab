      - bindings
      title: BoundObjectiveSchema
      description: 'One objective template bound to this shop''s objects, with its
        severity.


        `severity` is a field rather than a binding because every objective answers
        it, including

        templates that declare no parameter at all. A template that declares a `severity`

        parameter is resolved from this field, so binding it explicitly is refused
        rather than

        silently allowed to disagree.'
    CloneSandboxRequest:
      properties:
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
