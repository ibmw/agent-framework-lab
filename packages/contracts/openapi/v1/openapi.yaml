          type: integer
          minimum: 1.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - support_identity_id
      - version
      title: ToolActorSchema
      description: The published support-identity version whose authority the call
        runs under.
    ToolArgumentKind:
      type: string
      enum:
      - text
      - uuid
      - enum
      title: ToolArgumentKind
      description: How one argument's text is checked before a handler ever sees it.
    ToolArgumentSchema:
      properties:
        name:
          type: string
          title: Name
        kind:
          $ref: '#/components/schemas/ToolArgumentKind'
        description:
          type: string
          title: Description
        required:
          type: boolean
          title: Required
        choices:
          items:
            type: string
          type: array
          title: Choices
      additionalProperties: false
      type: object
      required:
      - name
      - kind
      - description
      - required
      - choices
      title: ToolArgumentSchema
      description: 'One argument a tool accepts, in the lab''s own typed vocabulary.


        Deliberately not JSON Schema: a framework adapter derives whatever dialect
        its SDK wants

        from this table, and the Studio renders a field from the same description.'
    ToolCallRequest:
      properties:
        tool:
          type: string
          minLength: 1
          title: Tool
          description: The published tool name to run.
        version:
          type: string
          minLength: 1
          title: Version
          description: The version of that tool this caller expects.
        arguments:
          additionalProperties:
            anyOf:
            - type: string
              maxLength: 500
            - type: 'null'
          propertyNames:
            maxLength: 64
          type: object
          maxProperties: 16
          title: Arguments
          description: The arguments this call fills, by name. A null or blank value
            is read as an argument the caller chose not to answer.
        actor:
          anyOf:
          - $ref: '#/components/schemas/ToolActorSchema'
          - type: 'null'
          description: 'Whose authority this call runs under. Required by a tool whose
            effect is ''write''; accepted and not yet consulted by a read. Deliberately
            outside the arguments: an agent that could name its own actor would be
            choosing its own permissions.'
      additionalProperties: false
      type: object
      required:
      - tool
      - version
      title: ToolCallRequest
    ToolCallResponse:
      properties:
        canonical_schema_version:
          type: string
          title: Canonical Schema Version
        tool:
          type: string
          title: Tool
        version:
          type: string
          title: Version
        arguments:
          additionalProperties:
            type: string
          type: object
          title: Arguments
        outcome:
          $ref: '#/components/schemas/ToolOutcome'
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
        refusal:
          anyOf:
          - $ref: '#/components/schemas/ToolRefusalSchema'
          - type: 'null'
        sandbox_revision:
          type: integer
          title: Sandbox Revision
        state_fingerprint:
          type: string
          title: State Fingerprint
      additionalProperties: false
      type: object
      required:
      - canonical_schema_version
      - tool
      - version
      - arguments
      - outcome
      - data
      - refusal
      - sandbox_revision
      - state_fingerprint
      title: ToolCallResponse
      description: 'One tool result, and where the arm stood when it answered.


        `data` is the tool''s own `tool-result-v1` payload, whose shape is that tool''s
        versioned

        contract. `sandbox_revision` and `state_fingerprint` are provenance rather
        than part of

        the answer, and they describe where the arm stood when the call *started*:
        for a read

        that is simply where it was, and for a write it is the world the change was
        computed

        against. A caller that needs the arm''s new position reads the arm.'
    ToolContractListResponse:
      properties:
        tools:
          items:
            $ref: '#/components/schemas/ToolContractSchema'
          type: array
          title: Tools
      additionalProperties: false
      type: object
      required:
      - tools
      title: ToolContractListResponse
    ToolContractSchema:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        summary:
          type: string
          title: Summary
        effect:
          $ref: '#/components/schemas/ToolEffect'
        required_permission:
          anyOf:
          - $ref: '#/components/schemas/SupportPermission'
          - type: 'null'
        arguments:
          items:
            $ref: '#/components/schemas/ToolArgumentSchema'
          type: array
          title: Arguments
      additionalProperties: false
      type: object
      required:
      - name
      - version
      - summary
      - effect
      - required_permission
      - arguments
      title: ToolContractSchema
      description: 'One published tool.


        `effect` is what tells a caller the two kinds apart before it calls either:
        a write needs

        an actor, and — for the one write published here — has to be proposed before
        it can be

        applied. An adapter reads it to route the two differently instead of keeping
        a list of

        tool names it knows to be dangerous. `required_permission` says which grant
        that actor

        needs, so an agent configuration can be refused for enabling a tool its support
        identity

        could never use.'
    ToolEffect:
      type: string
      enum:
      - read
      - write
      title: ToolEffect
      description: 'Whether running a tool can move the arm it runs against.


        Declared rather than inferred from the name, because it decides three things
        a caller

        must not have to guess: whether the call needs an authorized actor, whether
        a framework

        adapter has to route it through a confirmation step, and whether two identical
        calls

        against an unmoved arm are guaranteed to answer with identical bytes.'
    ToolEventSchema:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        ordinal:
          type: integer
          title: Ordinal
        attempt:
          type: integer
          title: Attempt
        sequence:
          type: integer
          title: Sequence
        tool:
          type: string
          title: Tool
        version:
          type: string
          title: Version
        outcome:
          $ref: '#/components/schemas/ToolOutcome'
        result:
          additionalProperties: true
          type: object
          title: Result
        revision_before:
          type: integer
          title: Revision Before
        revision_after:
          type: integer
          title: Revision After
        state_fingerprint:
          type: string
          title: State Fingerprint
        created_at:
          type: string
          title: Created At
      additionalProperties: false
      type: object
      required:
      - run_id
      - ordinal
      - attempt
      - sequence
      - tool
      - version
      - outcome
      - result
      - revision_before
      - revision_after
      - state_fingerprint
      - created_at
      title: ToolEventSchema
      description: 'One tool call one attempt made, and what it did to the arm.


        `result` is the `tool-result-v1` document the tool answered with, served whole
        rather

        than summarized: it is the published envelope already (ADR 0021), and a client
        that read

        a summary here would be reading a second description of evidence it can read
        directly.


        `revision_before` and `revision_after` are the state change. They are equal
        for a read;

        the one write this milestone publishes moves the arm by one, and the confirmation
        that

        authorized it is inside `result`.'
    ToolOutcome:
      type: string
      enum:
      - success
      - refused
      - failed
      title: ToolOutcome
      description: The three answers a tool call can end with, kept apart on purpose.
    ToolRefusalCode:
      type: string
      enum:
      - invalid_arguments
      - not_found
      - not_permitted
      - not_allowed
      - not_confirmed
      - conflict
      title: ToolRefusalCode
      description: 'Why a tool declined, in a vocabulary an agent can branch on.


        Declared beside the contracts rather than beside the handlers because a refusal
        code is

        published API: an adapter branches on it, and an evaluation reads it back
        as evidence.'
    ToolRefusalSchema:
      properties:
        code:
          $ref: '#/components/schemas/ToolRefusalCode'
        message:
          type: string
          title: Message
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ToolRefusalSchema
      description: Why the tool declined, in a vocabulary a caller can branch on.
    ValidationIssue:
      properties:
        location:
          type: string
          title: Location
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
      additionalProperties: false
      type: object
      required:
      - location
      - message
      - type
      title: ValidationIssue
    VariantAvailability:
      type: string
      enum:
      - in_stock
      - backorder
      - out_of_stock
      - discontinued
      title: VariantAvailability
    VariantOptionValueSchema:
      properties:
        key:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Key
        value:
          type: string
          maxLength: 200
          minLength: 1
          title: Value
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: VariantOptionValueSchema
    VariantSchema:
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Z0-9]+(?:-[A-Z0-9]+)*$
          title: Sku
        option_values:
          items:
            $ref: '#/components/schemas/VariantOptionValueSchema'
          type: array
          title: Option Values
        availability:
          $ref: '#/components/schemas/VariantAvailability'
        stock_quantity:
          type: integer
          minimum: 0.0
          title: Stock Quantity
        price:
          anyOf:
          - $ref: '#/components/schemas/MoneySchema'
          - type: 'null'
          description: Null while a draft variant is still unpriced.
      additionalProperties: false
      type: object
      required:
      - sku
      - option_values
      - availability
      - stock_quantity
      - price
      title: VariantSchema
