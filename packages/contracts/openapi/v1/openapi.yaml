  /api/v1/lab-seed:
    post:
      summary: Write the demo into an empty lab
      description: 'Writes one complete worked example — the wrong-address incident,
        authored end to end and driven to completion under two agent frameworks —
        through the same application services the screens call. Needs no provider
        credential and contacts no provider. Refuses with 409 rather than merging:
        a database that is not at the migration head, or that holds any row in a table
        the story writes, is left untouched and the tables that stopped it are named.
        Nothing here overwrites, wipes or reseeds.'
      operationId: seedLab
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSeedResponse'
  /api/v1/lab-status:
    get:
      summary: Report what this lab can reach and what it exports
      description: Whether this lab can reach a model provider right now, which of
        four answers is in force for the model connection — a saved connection, a
        saved connection whose key cannot be decrypted, the environment bootstrap,
        or neither — the model name the POC's conversation routes would reach for,
        and whether traces are exported anywhere. Answered per request, so a connection
        saved from the settings page changes it without a restart. Reports no fact
        about any credential beyond the run mode and the source, and never the exporter
        endpoint.
      operationId: getLabStatus
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabStatusResponse'
  /api/v1/model-connections:
    get:
      summary: List the providers this lab can be pointed at
      description: Every provider the lab has proven it can reach, with the connection
        it holds or `null`. Reports no fact about a stored key beyond whether one
        is installed and when it was saved.
      operationId: listModelConnections
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectionListResponse'
  /api/v1/model-connections/{provider_id}:
    get:
      summary: Read the connection this lab holds for one provider
      description: 'Answers with `connection: null` when nothing is saved, because
        a lab running on the environment bootstrap alone is a supported state rather
        than a missing resource. Reports no fact about the stored key.'
      operationId: getModelConnection
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: The provider id the proven-capability tables use, such as `openai`.
          title: Provider Id
        description: The provider id the proven-capability tables use, such as `openai`.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectionSchema'
        '422':
          description: The provider holds no connection in this lab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Point this lab at one endpoint for one provider
      description: 'Replaces this provider''s connection whole, so saving the same
        values twice leaves one row saying the same thing. The base URL is validated
        and normalized before it is stored: http or https only, no userinfo, query
        or fragment, and http only for a loopback or private host. Leaving `api_key`
        out keeps the stored key; supplying one replaces it, and the key is stored
        encrypted under AGENT_LAB_CREDENTIAL_KEY. With that variable unset the save
        is refused with 422 rather than storing a key this lab cannot protect. The
        connection holds no model: what an experiment runs is its published configuration''s
        model, never this process''s.'
      operationId: saveModelConnection
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: The provider id the proven-capability tables use, such as `openai`.
          title: Provider Id
        description: The provider id the proven-capability tables use, such as `openai`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveModelConnectionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectionSchema'
        '422':
          description: The provider holds no connection here, the base URL breaks
            a storage rule, or a key was supplied with no AGENT_LAB_CREDENTIAL_KEY
            set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/model-connections/{provider_id}/test:
    post:
      summary: Ask one endpoint whether it is reachable, right now
      description: 'Makes one cheap call under a short timeout to the connection in
        the body — falling back to the saved key when none is supplied — and answers
        `reachable`, `refused` or `unreachable` with the round trip in milliseconds.
        Stores nothing: a reachability result is true of a moment, and a stored green
        tick would be read as a promise the lab cannot keep. Never includes the upstream
        response body, only the class of the status it answered with.'
      operationId: testModelConnection
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: The provider id the proven-capability tables use, such as `openai`.
          title: Provider Id
        description: The provider id the proven-capability tables use, such as `openai`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConnectionTestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConnectionTestResponse'
        '422':
          description: The provider holds no connection here, the base URL breaks
            a storage rule, or the stored key cannot be read back under the current
            AGENT_LAB_CREDENTIAL_KEY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
