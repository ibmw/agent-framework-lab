      description: 'Both arms'' customer turns, agent attempts, tool calls, and the
        scenario faults that fired into them, in one ordered, framework-neutral stream,
        each entry carrying the project-owned source location of the code that ran
        it where this build can resolve one. Projected from the records `getExperiment`
        serves rather than stored beside them, so the timeline can never describe
        an experiment differently from its threads. Deliberately carries no message
        body: what was said is the thread''s, and what happened is this.'
      operationId: getExperimentTimeline
