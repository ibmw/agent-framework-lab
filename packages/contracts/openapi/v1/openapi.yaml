    post:
      summary: Run this arm's agent against the customer turn it has not answered
      description: 'Resolves the arm''s pinned configuration, renders its prompt against
        the shop and support-identity versions the experiment froze, and runs the
        framework against this arm''s own sandbox with exactly the tools the configuration
        enables. Answers with the attempt, every tool call it made, and every scenario
        fault that fired into this arm while it worked. Idempotent over an answer
        and not over an attempt: an arm whose latest customer turn is already answered
        returns that answer and calls no model, while one whose last attempt failed
        makes a new attempt beside it. A framework failure is a recorded turn and
        a 201, because it is evidence about the run; a framework this lab cannot run
        at all is a 422, because it is not.'
      operationId: advanceExperimentRun
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
