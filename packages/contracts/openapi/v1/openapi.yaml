      title: AgentFrameworkListResponse
    AgentFrameworkResponse:
      properties:
        framework_id:
          type: string
          title: Framework Id
        available:
          type: boolean
          title: Available
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        unavailability_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailability Reason
      additionalProperties: false
      type: object
      required:
      - framework_id
      - available
      - model_id
      - capabilities
      title: AgentFrameworkResponse
    AgentTurnFailure:
      type: string
      enum:
      - model_provider
      - model_transient
      - invalid_response
      - framework
      - tool_round_limit
      title: AgentTurnFailure
      description: 'Why an attempt failed, in a vocabulary a comparison can count.


        Deliberately about *where* the attempt broke rather than what the message
        said: a

        provider''s error text is neither stable across models nor safe to store beside

        synthetic customer content, and an experiment reading two arms needs the kinds
        to line

        up. The four execution kinds mirror the error taxonomy the POC''s conversation
        runner

        already answers with, so one failure means one thing across the lab.'
    AgentTurnOutcome:
      type: string
      enum:
      - answered
      - failed
      title: AgentTurnOutcome
      description: The two ways an attempt at one reply can end.
    AgentTurnSchema:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        ordinal:
          type: integer
          title: Ordinal
        attempt:
          type: integer
          title: Attempt
        outcome:
          $ref: '#/components/schemas/AgentTurnOutcome'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AgentTurnFailure'
          - type: 'null'
        body:
          type: string
          title: Body
        created_at:
          type: string
          title: Created At
      additionalProperties: false
      type: object
      required:
      - run_id
      - ordinal
      - attempt
      - outcome
      - failure
      - body
      - created_at
      title: AgentTurnSchema
      description: 'One attempt at one arm''s reply.


        `ordinal` is the customer turn being answered rather than a counter of its
        own, so a

        client renders a thread by pairing the two streams on it instead of interleaving
        by

        time. `attempt` counts retries: a failed attempt stays, and the next one sits
        beside it.


        A failed attempt carries a `failure` code and no `body`. There is deliberately
        no

        message: a framework''s error text is not something the agent said, and it
        would read as

        the reply everywhere a transcript is shown.'
    ArmSelectionSchema:
      properties:
        configuration_id:
          type: string
          format: uuid
          title: Configuration Id
        version:
          type: integer
          minimum: 1.0
          title: Version
          description: Immutable published version number.
        label:
          type: string
          maxLength: 200
          title: Label
          description: How an operator tells this arm from the one beside it. Defaults
            to the arm's position, because that is what a comparison refers to.
          default: ''
      additionalProperties: false
      type: object
      required:
      - configuration_id
      - version
      title: ArmSelectionSchema
      description: 'One arm: an exact published agent-configuration version, optionally
        named.'
    AttachCustomerProfileRequest:
      properties:
        shop_id:
          type: string
          format: uuid
          title: Shop Id
      additionalProperties: false
      type: object
      required:
      - shop_id
      title: AttachCustomerProfileRequest
    AttributeSchema:
      properties:
        key:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Key
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        attribute_type:
          $ref: '#/components/schemas/AttributeType'
        value:
          type: string
          maxLength: 200
          minLength: 1
          title: Value
        unit:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Unit
        choices:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Choices
      additionalProperties: false
      type: object
      required:
      - key
      - label
      - attribute_type
      - value
      - unit
      - choices
      title: AttributeSchema
    AttributeType:
      type: string
      enum:
      - text
      - number
      - boolean
      - choice
      - measurement
      title: AttributeType
      description: The first bounded set of author-defined typed attributes.
    BackgroundEntrySchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        kind:
          $ref: '#/components/schemas/BackgroundKind'
        occurred_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Occurred On
        note:
          type: string
          maxLength: 4000
          minLength: 1
          title: Note
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - occurred_on
      - note
      title: BackgroundEntrySchema
    BackgroundKind:
      type: string
      enum:
      - purchase
      - support_contact
      - account_event
      - life_event
      title: BackgroundKind
      description: What a piece of authored pre-sandbox history is about.
    BlockListResponse:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/BlockSummarySchema'
          type: array
          title: Blocks
      additionalProperties: false
      type: object
      required:
      - blocks
      title: BlockListResponse
    BlockParameterKind:
      type: string
      enum:
      - document_reference
      - entity_reference
      - data_reference
      - tool_reference
      - severity
      - timing
      - duration
      - text
      title: BlockParameterKind
      description: 'What a scenario must supply for one parameter.


        A closed enumeration, extended in code: the scenario editor offers a picker
        per kind and

        the runtime resolves a binding by kind, so a kind that does not exist here
        can never be

        bound to anything.'
    BlockParameterSchema:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
          title: Name
        kind:
          $ref: '#/components/schemas/BlockParameterKind'
        description:
          type: string
          maxLength: 4000
          title: Description
        required:
