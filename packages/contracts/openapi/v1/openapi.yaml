openapi: 3.1.0
info:
  title: Agent Framework Capability Lab API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      summary: Report API availability
      operationId: getHealth
      responses:
        '200':
          description: Service available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/agent-frameworks:
    get:
      summary: List agent frameworks and proven capabilities
      operationId: listAgentFrameworks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFrameworkListResponse'
  /api/v1/conversations:
    post:
      summary: Start a support conversation from generated scenario state
      operationId: startConversation
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Generated state is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid command or framework
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List support conversations most recently active first
      operationId: listConversations
      parameters:
      - name: scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - type: 'null'
          title: Scenario Id
      - name: scenario_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 64
            pattern: ^v[1-9][0-9]*$
          - type: 'null'
          title: Scenario Version
      - name: seed
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 4294967295
            minimum: 0
          - type: 'null'
          title: Seed
      - name: framework_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - type: 'null'
          title: Framework Id
      - name: active_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Active Since
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '422':
          description: Invalid filter or page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}:
    get:
      summary: Resume a persisted support conversation
      operationId: getConversation
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Permanently delete a conversation and its records
      operationId: deleteConversation
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Conversation is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/messages:
    post:
      summary: Send one message to a support conversation
      operationId: sendConversationMessage
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendConversationMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency or advanced-conversation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Agent execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Transient agent failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/actions/proposals:
    post:
      summary: Propose one versioned modifying order action
      operationId: proposeOrderAction
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeOrderActionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProposalResponse'
        '404':
          description: Conversation or order is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Action is refused or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/actions/{proposal_id}:
    get:
      summary: Retrieve a persisted order-action proposal
      operationId: getOrderAction
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProposalResponse'
        '404':
          description: Action proposal is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/actions/{proposal_id}/decision:
    post:
      summary: Confirm or cancel an exact proposed action
      operationId: decideOrderAction
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideOrderActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProposalResponse'
        '404':
          description: Action proposal is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Action state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Confirmation does not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/actions/{proposal_id}/execution:
    post:
      summary: Execute a confirmed order action idempotently
      operationId: executeOrderAction
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProposalResponse'
        '404':
          description: Action proposal is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale order version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Action is unconfirmed or refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Safe retries were exhausted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/scenarios/{scenario_id}/versions/{scenario_version}/generations:
    post:
      summary: Generate and persist deterministic scenario state
      operationId: generateScenario
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable scenario family identifier.
          title: Scenario Id
        description: Stable scenario family identifier.
      - name: scenario_version
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^v[1-9][0-9]*$
          description: Immutable scenario behavior version.
          title: Scenario Version
        description: Immutable scenario behavior version.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique retry key for this generation command.
          title: Idempotency-Key
        description: Unique retry key for this generation command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateScenarioRequest'
      responses:
        '201':
          description: Generated scenario state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedScenarioResponse'
        '404':
          description: Scenario version is not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency or generated-state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/scenarios/generations:
    get:
      summary: List generated personas most recently active first
      operationId: listGeneratedScenarios
      parameters:
      - name: scenario_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - type: 'null'
          title: Scenario Id
      - name: scenario_version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 64
            pattern: ^v[1-9][0-9]*$
          - type: 'null'
          title: Scenario Version
      - name: framework_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - type: 'null'
          title: Framework Id
      - name: active_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Active Since
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedScenarioListResponse'
        '422':
          description: Invalid filter or page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/scenarios/{scenario_id}/versions/{scenario_version}/generations/{seed}:
    get:
      summary: Retrieve persisted generated scenario state
      operationId: getGeneratedScenario
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable scenario family identifier.
          title: Scenario Id
        description: Stable scenario family identifier.
      - name: scenario_version
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^v[1-9][0-9]*$
          description: Immutable scenario behavior version.
          title: Scenario Version
        description: Immutable scenario behavior version.
      - name: seed
        in: path
        required: true
        schema:
          type: integer
          maximum: 4294967295
          minimum: 0
          description: Unsigned 32-bit deterministic generation seed.
          title: Seed
        description: Unsigned 32-bit deterministic generation seed.
      responses:
        '200':
          description: Persisted generated scenario state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedScenarioResponse'
        '404':
          description: Generated scenario is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid scenario reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Permanently delete a generated persona and its conversations
      operationId: deleteGeneratedScenario
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable scenario family identifier.
          title: Scenario Id
        description: Stable scenario family identifier.
      - name: scenario_version
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^v[1-9][0-9]*$
          description: Immutable scenario behavior version.
          title: Scenario Version
        description: Immutable scenario behavior version.
      - name: seed
        in: path
        required: true
        schema:
          type: integer
          maximum: 4294967295
          minimum: 0
          description: Unsigned 32-bit deterministic generation seed.
          title: Seed
        description: Unsigned 32-bit deterministic generation seed.
      responses:
        '204':
          description: Successful Response
        '404':
          description: Generated scenario is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid scenario reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops:
    get:
      summary: List shops with their draft identity and published-version provenance
      operationId: listShops
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListResponse'
    post:
      summary: Create a shop identity and its first draft
      operationId: createShop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopDraftResponse'
        '422':
          description: Invalid shop content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/draft:
    get:
      summary: Retrieve the mutable shop draft
      operationId: getShopDraft
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopDraftResponse'
        '404':
          description: The shop is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid shop content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Replace the shop draft without touching any published version
      operationId: replaceShopDraft
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceShopDraftRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopDraftResponse'
        '404':
          description: The shop is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid shop content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/draft/preview:
    get:
      summary: Validate the draft and preview the version publishing would create
      operationId: previewShopDraft
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopPreviewResponse'
        '404':
          description: The shop is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid shop content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/versions:
    post:
      summary: Freeze the draft into the next immutable published version
      operationId: publishShop
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopVersionResponse'
        '404':
          description: The shop is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The version already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The draft has publish-gate errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopValidationErrorResponse'
    get:
      summary: List a shop's published versions, newest first
      operationId: listShopVersions
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopVersionListResponse'
        '404':
          description: The shop is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid shop content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/versions/{version}:
    get:
      summary: Retrieve one immutable published shop version
      operationId: getShopVersion
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Immutable published shop version number.
          title: Version
        description: Immutable published shop version number.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
