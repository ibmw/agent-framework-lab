          type: integer
          title: After Calls
        revision_before:
          type: integer
          title: Revision Before
        revision_after:
          type: integer
          title: Revision After
        state_fingerprint:
          type: string
          title: State Fingerprint
        created_at:
          type: string
          title: Created At
