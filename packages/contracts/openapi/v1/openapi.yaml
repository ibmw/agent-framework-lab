  /api/v1/shops/{shop_id}/experiments/{experiment_id}/replays:
    post:
      summary: Derive a new experiment that re-runs this one as it was recorded
      description: 'Clones the snapshot this experiment froze rather than freezing
        the world again, so the derived arms start at the same `sandbox_fingerprint`
        however far the shop''s orders and definitions have moved since; pins each
        arm to the exact agent-configuration version this run pinned, because choosing
        a newer one is a fork rather than a replay; and drives the derived arms through
        the compositions this run recorded, to the same arms, at the same depths,
        advancing each arm as often as it was advanced then. The derived experiment
        records `scripted` as its participant driver, because that is what produced
        its turns, and answers with itself. Deliberately not idempotent: replaying
        one run twice is two derived experiments. Nothing about the replayed experiment
        changes — the derived run has its own arms, its own sandboxes, and its own
        evidence. A model-backed arm will not answer identically; what a replay reproduces
        is the input.'
      operationId: replayExperiment
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable experiment identifier inside one shop.
          title: Experiment Id
        description: Stable experiment identifier inside one shop.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '404':
          description: The experiment, or the starting state it froze, is not found
            in this shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The derived experiment cannot be started — its setup no longer
            passes, or its starting state was frozen against a tool contract set this
            build no longer publishes — or no runtime for an arm's framework is available
            here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/experiments/{experiment_id}/forks:
    post:
      summary: Derive a new experiment that runs this one's incident with other arms
      description: 'Everything a replay holds constant, a fork holds constant too
        — the same snapshot cloned again rather than the world re-frozen, the same
        recipe version at the same seed, the same arm positions and names, and the
        same recorded compositions delivered to the same arms at the same depths —
        and it changes exactly one thing: which published agent-configuration version
        each arm runs. That is what makes the derived run a comparison with its source
        rather than a new experiment, so a difference in the answers is about the
        arms. Names one arm per arm of the source, in the source''s arm order; at
        least one of them must differ from what that arm ran, because a derivation
        that changes nothing is a replay. The derived experiment records `scripted`,
        answers with itself, and reports on `derived_from.changed` the dimensions
        it moved — more than one, and no difference from the source can be attributed
        to any of them. Deliberately not idempotent. Nothing about the forked experiment
        changes.'
      operationId: forkExperiment
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable experiment identifier inside one shop.
          title: Experiment Id
        description: Stable experiment identifier inside one shop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkExperimentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '404':
          description: The experiment, the starting state it froze, or an agent-configuration
            version an arm names is not found — the same 404 a start answers for an
            arm it cannot resolve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The fork names the wrong number of arms or changes no arm at
            all; or the derived setup no longer passes the gate, its starting state
            was frozen against a tool contract set this build no longer publishes,
            or no runtime for an arm's framework is available here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/shops/{shop_id}/experiments/{experiment_id}/runs/{run_id}/agent-turns:
    post:
      summary: Run this arm's agent against the customer turn it has not answered
      description: 'Resolves the arm''s pinned configuration, renders its prompt against
        the shop and support-identity versions the experiment froze, and runs the
        framework against this arm''s own sandbox with exactly the tools the configuration
        enables. Answers with the attempt, every tool call it made, and every scenario
        fault that fired into this arm while it worked. Idempotent over an answer
        and not over an attempt: an arm whose latest customer turn is already answered
        returns that answer and calls no model, while one whose last attempt failed
        makes a new attempt beside it. A framework failure is a recorded turn and
        a 201, because it is evidence about the run; a framework this lab cannot run
        at all is a 422, because it is not. The first advance that reaches a provider
        records the endpoint on the run, and a later advance that would reach a different
        one is refused with 422 naming both rather than producing half an arm against
        each.'
      operationId: advanceExperimentRun
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable shop definition identifier.
          title: Shop Id
        description: Stable shop definition identifier.
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Stable experiment identifier inside one shop.
          title: Experiment Id
        description: Stable experiment identifier inside one shop.
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: One arm of this experiment.
          title: Run Id
        description: One arm of this experiment.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunTurnResponse'
        '404':
          description: The experiment or the named arm is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No runtime for this arm's framework is available here, or this
