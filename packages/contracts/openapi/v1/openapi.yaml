      - support_identity_version
      - content
      title: AgentConfigurationVersionResponse
    AgentFrameworkListResponse:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/AgentFrameworkResponse'
          type: array
          title: Frameworks
      additionalProperties: false
      type: object
      required:
      - frameworks
      title: AgentFrameworkListResponse
    AgentFrameworkResponse:
      properties:
        framework_id:
          type: string
          title: Framework Id
        available:
          type: boolean
          title: Available
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        unavailability_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailability Reason
      additionalProperties: false
      type: object
      required:
      - framework_id
      - available
      - model_id
      - capabilities
      title: AgentFrameworkResponse
    AgentTurnFailure:
      type: string
      enum:
      - model_provider
      - model_transient
      - invalid_response
      - framework
      - tool_round_limit
      title: AgentTurnFailure
      description: 'Why an attempt failed, in a vocabulary a comparison can count.


        Deliberately about *where* the attempt broke rather than what the message
        said: a

        provider''s error text is neither stable across models nor safe to store beside

        synthetic customer content, and an experiment reading two arms needs the kinds
        to line

        up. The four execution kinds mirror the error taxonomy the POC''s conversation
        runner

        already answers with, so one failure means one thing across the lab.'
    AgentTurnOutcome:
      type: string
      enum:
      - answered
      - failed
      title: AgentTurnOutcome
      description: The two ways an attempt at one reply can end.
    AgentTurnSchema:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        ordinal:
          type: integer
          title: Ordinal
        attempt:
          type: integer
          title: Attempt
        outcome:
          $ref: '#/components/schemas/AgentTurnOutcome'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AgentTurnFailure'
          - type: 'null'
        body:
          type: string
          title: Body
        created_at:
          type: string
          title: Created At
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        usage:
          anyOf:
          - $ref: '#/components/schemas/ModelUsageSchema'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - run_id
      - ordinal
      - attempt
      - outcome
      - failure
      - body
      - created_at
      - duration_ms
      - usage
      title: AgentTurnSchema
      description: 'One attempt at one arm''s reply.


        `ordinal` is the customer turn being answered rather than a counter of its
        own, so a

        client renders a thread by pairing the two streams on it instead of interleaving
        by

        time. `attempt` counts retries: a failed attempt stays, and the next one sits
        beside it.


        A failed attempt carries a `failure` code and no `body`. There is deliberately
        no

        message: a framework''s error text is not something the agent said, and it
        would read as

        the reply everywhere a transcript is shown.'
    ArmAwaiting:
      type: string
      enum:
      - agent
      - customer
      - completed
      title: ArmAwaiting
      description: 'What one arm is waiting for, which is the only thing an operator
        can act on.


        Two of these are the moves the bench offers — run the agent, or write the
        customer''s next

        message — and the third is the absence of both. ADR 0029 left it out because
        a completion

        claim needed an evaluation to make it; it is here now, and it is still not
        a status

        anyone sets: an arm is completed when it has answered the last turn its scenario''s
        cap

        allows, which is read off the same two streams as the other two values (ADR
        0030).


        The cap is the half of the scenario''s completion conditions this build decides.
        Whether

        the incident was actually *resolved* is the completion statement''s, and that
        is prose a

        judge reads rather than a number a runtime counts.'
    ArmEvaluationSchema:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        settled:
          type: boolean
          title: Settled
        met:
          type: integer
          title: Met
        decided:
          type: integer
          title: Decided
        failed:
          type: boolean
          title: Failed
        objectives:
          items:
            $ref: '#/components/schemas/ObjectiveResultSchema'
          type: array
          title: Objectives
      additionalProperties: false
      type: object
      required:
      - run_id
      - settled
      - met
      - decided
      - failed
      - objectives
      title: ArmEvaluationSchema
      description: 'One arm judged against every objective its scenario composed.


        `decided` is what `met` is out of, and it is smaller than the objective list
        whenever a

        judge or a kind of evidence this build does not read owns a row: counting
        those as

        misses would report the lab''s own limits as the agent''s.'
    ArmMetricsSchema:
      properties:
        turns:
          type: integer
          title: Turns
        answered_turns:
          type: integer
          title: Answered Turns
        attempts:
          type: integer
          title: Attempts
        retries:
          type: integer
          title: Retries
        failures:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/AgentTurnFailure'
          type: object
          title: Failures
        tool_calls:
          type: integer
          title: Tool Calls
        tool_writes:
          type: integer
          title: Tool Writes
        model_requests:
          anyOf:
          - type: integer
          - type: 'null'
          title: Model Requests
        usage:
          anyOf:
          - $ref: '#/components/schemas/ModelUsageSchema'
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        tool_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tool Duration Ms
        measured_attempts:
          type: integer
          title: Measured Attempts
        metered_attempts:
          type: integer
          title: Metered Attempts
        estimated_cost:
          anyOf:
          - $ref: '#/components/schemas/EstimatedCostSchema'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - turns
      - answered_turns
      - attempts
      - retries
      - failures
      - tool_calls
      - tool_writes
      - model_requests
      - usage
      - duration_ms
      - tool_duration_ms
      - measured_attempts
      - metered_attempts
      - estimated_cost
      title: ArmMetricsSchema
      description: 'What one arm has spent so far: turns, calls, tokens, time, and
        an estimate.


        Served rather than counted by the client for the reason the standing is (ADR
        0029): the

        rows are already here, and a client that counted them again would be free
        to count them

        differently. Every number is of the record as it stands, so an arm still being
        driven

        reports a growing total rather than waiting for a completion nobody sets.


        Deliberately no aggregate and no arm-versus-arm delta. An efficiency reading
        is only

        interpretable beside the outcome, which is the evaluation''s, and the product
        direction

        forbids collapsing evidence into one score.'
    ArmSelectionSchema:
      properties:
        configuration_id:
          type: string
          format: uuid
          title: Configuration Id
        version:
          type: integer
          minimum: 1.0
          title: Version
          description: Immutable published version number.
        label:
          type: string
          maxLength: 200
          title: Label
          description: How an operator tells this arm from the one beside it. Defaults
            to the arm's position, because that is what a comparison refers to.
          default: ''
      additionalProperties: false
      type: object
      required:
      - configuration_id
      - version
      title: ArmSelectionSchema
      description: 'One arm: an exact published agent-configuration version, optionally
        named.'
    ArmStandingSchema:
      properties:
        awaiting:
          $ref: '#/components/schemas/ArmAwaiting'
        ordinal:
          type: integer
          title: Ordinal
        attempts:
          type: integer
          title: Attempts
        unanswered:
          items:
            type: integer
          type: array
          title: Unanswered
      additionalProperties: false
      type: object
      required:
      - awaiting
      - ordinal
      - attempts
      - unanswered
      title: ArmStandingSchema
      description: 'What one arm is waiting for, and where in its thread it is waiting.


        Served rather than left to the client because the runner reads the same rule
        to decide

        what an advance does (ADR 0029): a client that derived it again would be free
        to offer a

        button for something the backend would answer differently.'
    ArmStateDiffSchema:
      properties:
        orders:
          items:
            $ref: '#/components/schemas/OrderStateDiffSchema'
          type: array
          title: Orders
        other:
          items:
            $ref: '#/components/schemas/FieldChangeSchema'
          type: array
          title: Other
      additionalProperties: false
      type: object
      required:
      - orders
      - other
      title: ArmStateDiffSchema
      description: 'What one arm''s world is, read against the world it was cloned
        into.


        Served rather than computed by the client for the reason the standing and
        the metrics

        are: it is a difference between the exact bytes two fingerprints cover, and
        a client

        comparing its own two readings would be free to decide differently what changed.


        `other` carries changes outside every order, which nothing in this build can
        produce —

        an empty list is the "no other state changed" check passing rather than a
        section with

        nothing in it.'
    AttachCustomerProfileRequest:
      properties:
        shop_id:
          type: string
          format: uuid
          title: Shop Id
      additionalProperties: false
      type: object
      required:
