    TimelineCategory:
      type: string
      enum:
      - customer
      - model
      - tool
      - state
      - refusal
      - error
      title: TimelineCategory
      description: 'The lenses an operator filters this stream through.


        An entry may carry several: a write that succeeded is a tool call *and* a
        state change,

        and a failed attempt is a model event *and* an error. Filtering is therefore
        membership

        rather than a single label, which is what lets "show me only what moved an
        arm" and

        "show me only what broke" both be honest questions about the same stream.'
    TimelineEntryKind:
      type: string
      enum:
      - trigger
      - customer_turn
      - agent_turn
      - tool_call
      - mutation
      title: TimelineEntryKind
      description: What one entry is, in the lab's vocabulary rather than any framework's.
    TimelineEntrySchema:
      properties:
        step:
          type: integer
          title: Step
        kind:
          $ref: '#/components/schemas/TimelineEntryKind'
        categories:
          items:
            $ref: '#/components/schemas/TimelineCategory'
          type: array
          title: Categories
        run_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Run Ids
        occurred_at:
          type: string
          title: Occurred At
        composition_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Composition Id
        ordinal:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ordinal
        attempt:
          anyOf:
          - type: integer
          - type: 'null'
          title: Attempt
        sequence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sequence
        tool:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool
        tool_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Version
        tool_outcome:
          anyOf:
          - $ref: '#/components/schemas/ToolOutcome'
          - type: 'null'
        mutation:
          anyOf:
          - type: string
          - type: 'null'
          title: Mutation
        mutation_effect:
          anyOf:
          - $ref: '#/components/schemas/MutationEffect'
          - type: 'null'
        turn_outcome:
          anyOf:
          - $ref: '#/components/schemas/AgentTurnOutcome'
          - type: 'null'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AgentTurnFailure'
          - type: 'null'
        revision_before:
          anyOf:
          - type: integer
          - type: 'null'
          title: Revision Before
        revision_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Revision After
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceLocationSchema'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - step
      - kind
      - categories
      - run_ids
      - occurred_at
      - composition_id
      - ordinal
      - attempt
      - sequence
      - tool
      - tool_version
      - tool_outcome
      - mutation
      - mutation_effect
      - turn_outcome
      - failure
      - revision_before
      - revision_after
      - source
      title: TimelineEntrySchema
      description: 'One normalized event in an experiment''s execution.


        Deliberately carries no message, reply, or tool argument. The thread `getExperiment`

        serves is where what was said belongs; this stream says what happened, so
        it can be

        filtered, counted, and later handed to an evaluation without carrying synthetic
        customer

        content along with it.


        `step` is the customer composition this entry belongs to and is the one coordinate
        both

        arms share — `ordinal` counts one arm''s own turns, and two arms driven to
        different

        depths hold different ordinals for the same message.


        `source` is where the project''s own code that ran this lives, and is absent
        whenever it

        is not the project''s to point at: a framework''s internals, an adapter this
        process does

        not have, or a tool this build no longer publishes.'
    ToneOfVoiceSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        guidance:
          type: string
          maxLength: 4000
          minLength: 1
          title: Guidance
        is_default:
          type: boolean
          title: Is Default
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - guidance
      - is_default
      title: ToneOfVoiceSchema
    ToneOfVoiceSelectionSchema:
      properties:
        source:
          $ref: '#/components/schemas/ToneOfVoiceSource'
        guideline_id:
          type: string
          maxLength: 64
          title: Guideline Id
          default: ''
      additionalProperties: false
      type: object
      required:
      - source
      title: ToneOfVoiceSelectionSchema
    ToneOfVoiceSource:
      type: string
      enum:
      - shop_default
      - override
      title: ToneOfVoiceSource
      description: Where the agent's tone comes from when a shop resolves the configuration.
    ToolActivityResponse:
