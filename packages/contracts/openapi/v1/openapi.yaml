  /api/v1/shops/{shop_id}/sandboxes/{sandbox_id}/tool-calls:
    post:
      summary: Run one versioned tool against one arm's sandbox
      description: Reads the arm's own state and the exact published versions its
        snapshot pinned, and — for a tool whose effect is 'write' — changes that arm
