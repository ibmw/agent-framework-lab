        description:
          type: string
          maxLength: 4000
          title: Description
        required:
          type: boolean
          title: Required
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
        shop_bound:
          type: boolean
          title: Shop Bound
          default: false
      additionalProperties: false
      type: object
      required:
