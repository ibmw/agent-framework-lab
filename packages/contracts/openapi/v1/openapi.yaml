          type: integer
          title: Attempt
        outcome:
          $ref: '#/components/schemas/AgentTurnOutcome'
        failure:
          anyOf:
          - $ref: '#/components/schemas/AgentTurnFailure'
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        spans:
          items:
            $ref: '#/components/schemas/RunTraceSpanSchema'
          type: array
          title: Spans
      additionalProperties: false
      type: object
      required:
      - run_id
      - arm_label
      - framework_id
      - model_id
      - ordinal
      - attempt
      - outcome
      - failure
      - duration_ms
      - trace_id
      - spans
      title: RunTraceSchema
      description: 'One attempt of one arm, and the trace of it where the lab recorded
        one.


        Every recorded attempt appears, including the ones made before this lab traced
        anything:

        `trace_id` is absent and `spans` is empty, which says nobody watched rather
        than nothing

        happened. An invented waterfall would be the mistake ADR 0032 refused when
        it left an

        unmeasured duration null.'
    RunTraceSpanSchema:
      properties:
        span_id:
          type: string
          title: Span Id
        parent_span_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Span Id
        kind:
          $ref: '#/components/schemas/SpanKind'
        started_offset_ms:
          type: integer
          title: Started Offset Ms
        duration_ms:
          type: integer
          title: Duration Ms
        sequence:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sequence
        tool:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool
        tool_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Version
        tool_outcome:
          anyOf:
          - $ref: '#/components/schemas/ToolOutcome'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - span_id
      - parent_span_id
      - kind
      - started_offset_ms
      - duration_ms
      - sequence
      - tool
      - tool_version
      - tool_outcome
      title: RunTraceSpanSchema
      description: 'One span of one attempt, with what the record says it was about
        joined onto it.


        The stored span carries no attribute of its own — only hex identifiers, a
        closed kind,

        and two millisecond counts — so a trace can never become the way synthetic
        customer

        content leaves the lab. `tool`, `tool_version`, and `tool_outcome` are read
        from the tool

        event this span''s `sequence` names, which is the same document the timeline
        reads.


        `started_offset_ms` is measured from the start of the attempt, and it is the
        one fact

        here that no other reading of an experiment can supply: the record timestamps
        an attempt

        and every call it made from one reading of the clock, so where inside the
        attempt a call

        ran — and therefore how much of the attempt was the framework thinking rather
        than the

        lab answering — is gone unless it is recorded.'
    RunTurnResponse:
      properties:
        turn:
          $ref: '#/components/schemas/AgentTurnSchema'
        tool_events:
          items:
            $ref: '#/components/schemas/ToolEventSchema'
          type: array
          title: Tool Events
        mutation_events:
          items:
            $ref: '#/components/schemas/MutationEventSchema'
          type: array
