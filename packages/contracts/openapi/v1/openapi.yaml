components:
  schemas:
    AccountFactsSchema:
      properties:
        customer_since:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Customer Since
        status:
          $ref: '#/components/schemas/AccountStatus'
        loyalty_tier:
          $ref: '#/components/schemas/LoyaltyTier'
        marketing_opt_in:
          type: boolean
          title: Marketing Opt In
        notes:
          type: string
          maxLength: 4000
          title: Notes
      additionalProperties: false
      type: object
      required:
      - customer_since
      - status
      - loyalty_tier
      - marketing_opt_in
      - notes
      title: AccountFactsSchema
    AccountStatus:
      type: string
      enum:
      - active
      - dormant
      - closed
      title: AccountStatus
    ActionProposalResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        action_type:
          type: string
          const: cancel_order
          title: Action Type
        tool_name:
          type: string
          const: cancel_order
          title: Tool Name
        tool_version:
          type: string
          const: v1
          title: Tool Version
        order_id:
          type: string
          format: uuid
          title: Order Id
        expected_version:
          type: integer
          title: Expected Version
        summary:
          type: string
          title: Summary
        confirmation_token:
          type: string
          title: Confirmation Token
        status:
          type: string
          enum:
          - proposed
          - confirmed
          - cancelled
          - executed
          title: Status
        attempts:
          type: integer
          title: Attempts
        result_order_status:
          anyOf:
          - type: string
            const: cancelled
          - type: 'null'
          title: Result Order Status
        result_order_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Result Order Version
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - action_type
      - tool_name
      - tool_version
      - order_id
      - expected_version
      - summary
      - confirmation_token
      - status
      - attempts
      - result_order_status
      - result_order_version
      title: ActionProposalResponse
    AddExperimentNoteRequest:
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 1
          title: Body
          description: What the reviewer concluded, in their own words.
      additionalProperties: false
      type: object
      required:
      - body
      title: AddExperimentNoteRequest
      description: 'One thing an operator wants recorded about this run.


        Stripped here rather than left to the domain, because padding is a fact about
        a text box

        and not about what the reviewer wrote. Length is then measured on what will
        actually be

        stored, so a body of spaces is the contract''s own "must not be empty" rather
        than a

        domain refusal the 422 description does not describe.'
    AddressSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        line1:
          type: string
          maxLength: 200
          minLength: 1
          title: Line1
        line2:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Line2
        postal_code:
          type: string
          maxLength: 200
          minLength: 1
          title: Postal Code
        city:
          type: string
          maxLength: 200
          minLength: 1
          title: City
        region:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Region
        country:
          type: string
          pattern: ^[A-Z]{2}$
          title: Country
        is_default:
          type: boolean
          title: Is Default
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - recipient
      - line1
      - line2
      - postal_code
      - city
      - region
      - country
      - is_default
      title: AddressSchema
    AgentArchitecture:
      type: string
      enum:
      - single_agent
      title: AgentArchitecture
      description: 'How the framework is asked to organize the work.


        One member until a second is proven end to end. Milestone 6 decides whether
        the first

        controlled comparison changes framework or architecture; adding the member
        before there

        is an implementation behind it would let an author publish a configuration
        nothing can

        run.'
    AgentCapability:
      type: string
      enum:
      - tool_calls
      - conversation_memory
      - durable_memory
      - session_resume
      - structured_output
      - tracing
      title: AgentCapability
    AgentConfigurationDraftResponse:
      properties:
        configuration_id:
          type: string
          format: uuid
          title: Configuration Id
        lifecycle_state:
          type: string
          const: draft
          title: Lifecycle State
          default: draft
        content:
          $ref: '#/components/schemas/AgentConfigurationPayloadSchema'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - configuration_id
      - content
      - created_at
      - updated_at
      title: AgentConfigurationDraftResponse
    AgentConfigurationListResponse:
      properties:
        configurations:
          items:
            $ref: '#/components/schemas/AgentConfigurationSummarySchema'
          type: array
          title: Configurations
      additionalProperties: false
      type: object
      required:
      - configurations
      title: AgentConfigurationListResponse
    AgentConfigurationPayloadSchema:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 4000
          title: Description
        framework_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Framework Id
        architecture:
          $ref: '#/components/schemas/AgentArchitecture'
        support_identity_id:
          type: string
          format: uuid
          title: Support Identity Id
        prompt:
          type: string
          maxLength: 20000
          title: Prompt
        tone_of_voice:
          $ref: '#/components/schemas/ToneOfVoiceSelectionSchema'
        tools:
          items:
            type: string
            maxLength: 100
            minLength: 1
          type: array
          title: Tools
        memory:
          $ref: '#/components/schemas/MemoryMode'
        model:
          $ref: '#/components/schemas/ModelSettingsSchema'
      additionalProperties: false
      type: object
      required:
      - name
      - description
      - framework_id
      - architecture
      - support_identity_id
      - prompt
      - tone_of_voice
      - tools
      - memory
      - model
      title: AgentConfigurationPayloadSchema
      description: The whole authored content of a configuration draft or published
        version.
    AgentConfigurationPreviewResponse:
      properties:
        configuration_id:
          type: string
          format: uuid
          title: Configuration Id
        publishable:
          type: boolean
          title: Publishable
        issues:
          items:
            $ref: '#/components/schemas/DefinitionIssueSchema'
          type: array
          title: Issues
        changes:
          items:
            $ref: '#/components/schemas/DefinitionChangeSchema'
          type: array
          title: Changes
        content_fingerprint:
          type: string
          title: Content Fingerprint
        latest_published_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Published Version
        next_version:
          type: integer
          title: Next Version
        matches_latest_published:
          type: boolean
          title: Matches Latest Published
        content:
          $ref: '#/components/schemas/AgentConfigurationPayloadSchema'
        resolution:
          $ref: '#/components/schemas/AgentConfigurationResolutionSchema'
      additionalProperties: false
      type: object
      required:
      - configuration_id
      - publishable
      - issues
      - changes
      - content_fingerprint
      - latest_published_version
      - next_version
      - matches_latest_published
      - content
      - resolution
      title: AgentConfigurationPreviewResponse
      description: The publish gate and the resolved context, which an author reads
        side by side.
    AgentConfigurationResolutionSchema:
      properties:
        framework_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Framework Label
        shop_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Shop Id
        shop_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Shop Name
        shop_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Shop Version
        support_identity_id:
          type: string
          format: uuid
          title: Support Identity Id
        support_identity_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Support Identity Name
        support_identity_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Support Identity Version
        tone_of_voice_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Tone Of Voice Label
        tone_of_voice_resolved:
          type: boolean
          title: Tone Of Voice Resolved
        variables:
          items:
            $ref: '#/components/schemas/ResolvedVariableSchema'
          type: array
          title: Variables
        tools:
          items:
            $ref: '#/components/schemas/ResolvedToolBindingSchema'
          type: array
          title: Tools
      additionalProperties: false
      type: object
      required:
      - framework_label
      - shop_id
      - shop_name
      - shop_version
      - support_identity_id
      - support_identity_name
      - support_identity_version
      - tone_of_voice_label
      - tone_of_voice_resolved
      - variables
      - tools
      title: AgentConfigurationResolutionSchema
      description: What a run would inject, read beside the publish gate.
    AgentConfigurationResourcesResponse:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/ProvenFrameworkSchema'
          type: array
          title: Frameworks
        tools:
          items:
            $ref: '#/components/schemas/ToolContractSchema'
          type: array
          title: Tools
        variables:
          items:
            $ref: '#/components/schemas/PromptVariableSchema'
          type: array
          title: Variables
        support_identities:
          items:
            $ref: '#/components/schemas/SupportIdentityOptionSchema'
          type: array
          title: Support Identities
        preview_shops:
          items:
            $ref: '#/components/schemas/PreviewShopOptionSchema'
          type: array
          title: Preview Shops
      additionalProperties: false
      type: object
      required:
      - frameworks
      - tools
      - variables
      - support_identities
      - preview_shops
      title: AgentConfigurationResourcesResponse
      description: Exactly what a configuration may name, so a picker cannot offer
        a gate error.
    AgentConfigurationSummarySchema:
      properties:
        configuration_id:
          type: string
          format: uuid
          title: Configuration Id
        name:
          type: string
          title: Name
        framework_id:
          type: string
          title: Framework Id
        framework_label:
          type: string
          title: Framework Label
        model_id:
          type: string
          title: Model Id
        support_identity_id:
          type: string
          format: uuid
          title: Support Identity Id
        tool_count:
