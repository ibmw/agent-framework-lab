          type: string
          format: uuid
          title: Run Id
        arm_label:
          type: string
          title: Arm Label
        framework_id:
          type: string
          title: Framework Id
        model_id:
          type: string
          title: Model Id
        ordinal:
          type: integer
          title: Ordinal
