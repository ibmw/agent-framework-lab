      description: 'The axes along which two agent configurations can differ.


        Exactly the inputs an experiment is allowed to attribute a difference in behavior
        to.

        Anything an arm discovers at run time is deliberately absent: both arms work
        the same

        starting state, so the world is not a comparison variable (ADR 0019, ADR 0020).'
    ComparisonVariableSchema:
      properties:
        dimension:
          $ref: '#/components/schemas/ComparisonDimension'
        values:
          items:
            type: string
          type: array
          title: Values
        differs:
          type: boolean
          title: Differs
      additionalProperties: false
      type: object
      required:
      - dimension
      - values
      - differs
      title: ComparisonVariableSchema
      description: 'One dimension of the setup matrix: what each arm holds, and whether
        they disagree.'
    CompletionConditionsSchema:
