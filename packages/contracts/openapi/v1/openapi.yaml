          type: string
          title: Provider
        model_id:
          type: string
          title: Model Id
        sandbox_id:
          type: string
          format: uuid
          title: Sandbox Id
        revision:
          type: integer
          title: Revision
        snapshot_fingerprint:
          type: string
          title: Snapshot Fingerprint
        state_fingerprint:
          type: string
          title: State Fingerprint
        standing:
          $ref: '#/components/schemas/ArmStandingSchema'
        metrics:
