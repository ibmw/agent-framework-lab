        turn inside it, and every tool call it made, each carrying where inside the
        attempt it ran. Unlike the timeline beside it, this is stored rather than
        projected — an attempt and its calls are timestamped from one reading of the
        clock, so how the attempt''s milliseconds were spent is not recoverable from
