openapi: 3.1.0
info:
  title: Agent Framework Capability Lab API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      summary: Report API availability
      operationId: getHealth
      responses:
        '200':
          description: Service available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/agent-frameworks:
    get:
      summary: List agent frameworks and proven capabilities
      operationId: listAgentFrameworks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFrameworkListResponse'
  /api/v1/conversations:
    post:
      summary: Start a support conversation from generated scenario state
      operationId: startConversation
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Generated state is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid command or framework
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}:
    get:
      summary: Resume a persisted support conversation
      operationId: getConversation
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/conversations/{session_id}/messages:
    post:
      summary: Send one message to a support conversation
      operationId: sendConversationMessage
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendConversationMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency or advanced-conversation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Agent execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Transient agent failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/scenarios/{scenario_id}/versions/{scenario_version}/generations:
    post:
      summary: Generate and persist deterministic scenario state
      operationId: generateScenario
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable scenario family identifier.
          title: Scenario Id
        description: Stable scenario family identifier.
      - name: scenario_version
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^v[1-9][0-9]*$
          description: Immutable scenario behavior version.
          title: Scenario Version
        description: Immutable scenario behavior version.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique retry key for this generation command.
          title: Idempotency-Key
        description: Unique retry key for this generation command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateScenarioRequest'
      responses:
        '201':
          description: Generated scenario state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedScenarioResponse'
        '404':
          description: Scenario version is not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency or generated-state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/scenarios/{scenario_id}/versions/{scenario_version}/generations/{seed}:
    get:
      summary: Retrieve persisted generated scenario state
      operationId: getGeneratedScenario
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable scenario family identifier.
          title: Scenario Id
        description: Stable scenario family identifier.
      - name: scenario_version
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^v[1-9][0-9]*$
          description: Immutable scenario behavior version.
          title: Scenario Version
        description: Immutable scenario behavior version.
      - name: seed
        in: path
        required: true
        schema:
          type: integer
          maximum: 4294967295
          minimum: 0
          description: Unsigned 32-bit deterministic generation seed.
          title: Seed
        description: Unsigned 32-bit deterministic generation seed.
      responses:
        '200':
          description: Persisted generated scenario state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedScenarioResponse'
        '404':
          description: Generated scenario is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid scenario reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AgentFrameworkListResponse:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/AgentFrameworkResponse'
          type: array
          title: Frameworks
      additionalProperties: false
      type: object
      required:
      - frameworks
      title: AgentFrameworkListResponse
    AgentFrameworkResponse:
      properties:
        framework_id:
          type: string
          title: Framework Id
        available:
          type: boolean
          title: Available
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        unavailability_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailability Reason
      additionalProperties: false
      type: object
      required:
      - framework_id
      - available
      - model_id
      - capabilities
      title: AgentFrameworkResponse
    ConversationResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        customer_id:
          type: string
          format: uuid
          title: Customer Id
        scenario_id:
          type: string
          title: Scenario Id
        scenario_version:
          type: string
          title: Scenario Version
        seed:
          type: integer
          title: Seed
        framework_id:
          type: string
          title: Framework Id
        initial_state_hash:
          type: string
          title: Initial State Hash
        created_at:
          type: string
          format: date-time
          title: Created At
        turns:
          items:
            $ref: '#/components/schemas/ConversationTurnResponse'
          type: array
          title: Turns
      additionalProperties: false
      type: object
      required:
      - id
      - customer_id
      - scenario_id
      - scenario_version
      - seed
      - framework_id
      - initial_state_hash
      - created_at
      - turns
      title: ConversationResponse
    ConversationTurnResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        ordinal:
          type: integer
          title: Ordinal
        request_message:
          type: string
          title: Request Message
        response_message:
          type: string
          title: Response Message
        structured_result:
          $ref: '#/components/schemas/StructuredSupportResultResponse'
        tool_activity:
          items:
            $ref: '#/components/schemas/ToolActivityResponse'
          type: array
          title: Tool Activity
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - ordinal
      - request_message
      - response_message
      - structured_result
      - tool_activity
      - trace_id
      - created_at
      title: ConversationTurnResponse
    CustomerResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        display_name:
          type: string
          title: Display Name
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - email
      - display_name
      - created_at
      title: CustomerResponse
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        request_id:
          type: string
          title: Request Id
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          - type: 'null'
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorResponse
    GenerateScenarioRequest:
      properties:
        seed:
          type: integer
          maximum: 4294967295.0
          minimum: 0.0
          title: Seed
          description: Unsigned 32-bit deterministic generation seed.
      additionalProperties: false
      type: object
      required:
      - seed
      title: GenerateScenarioRequest
    GeneratedScenarioResponse:
      properties:
        metadata:
          $ref: '#/components/schemas/ScenarioMetadataResponse'
        initial_state_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Initial State Hash
        initial_state:
          $ref: '#/components/schemas/InitialStateResponse'
      additionalProperties: false
      type: object
      required:
      - metadata
      - initial_state_hash
      - initial_state
      title: GeneratedScenarioResponse
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
        api_version:
          type: string
          const: v1
          title: Api Version
      additionalProperties: false
      type: object
      required:
      - status
      - api_version
      title: HealthResponse
    InitialStateResponse:
      properties:
        canonical_schema_version:
          type: string
          title: Canonical Schema Version
        scenario:
          $ref: '#/components/schemas/ScenarioReferenceResponse'
        seed:
          type: integer
          title: Seed
        persona:
          $ref: '#/components/schemas/PersonaResponse'
        customer:
          $ref: '#/components/schemas/CustomerResponse'
        products:
          items:
            $ref: '#/components/schemas/ProductResponse'
          type: array
          title: Products
        orders:
          items:
            $ref: '#/components/schemas/OrderResponse'
          type: array
          title: Orders
      additionalProperties: false
      type: object
      required:
      - canonical_schema_version
      - scenario
      - seed
      - persona
      - customer
      - products
      - orders
      title: InitialStateResponse
    OrderResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        customer_id:
          type: string
          format: uuid
          title: Customer Id
        created_at:
          type: string
          format: date-time
          title: Created At
        status:
          type: string
          enum:
          - pending
          - paid
          - cancelled
          title: Status
        version:
          type: integer
          minimum: 1.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - id
      - customer_id
      - created_at
      - status
      - version
      title: OrderResponse
    PersonaResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        display_name:
          type: string
          title: Display Name
        email:
          type: string
          title: Email
        locale:
          type: string
          title: Locale
        support_traits:
          items:
            type: string
          type: array
          title: Support Traits
      additionalProperties: false
      type: object
      required:
      - id
      - display_name
      - email
      - locale
      - support_traits
      title: PersonaResponse
    ProductResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        sku:
          type: string
          title: Sku
        name:
          type: string
          title: Name
        price_amount:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          title: Price Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
      additionalProperties: false
      type: object
      required:
      - id
      - sku
      - name
      - price_amount
      - currency
      title: ProductResponse
    ScenarioMetadataResponse:
      properties:
        scenario_id:
          type: string
          title: Scenario Id
        scenario_version:
          type: string
          title: Scenario Version
        policy_set_version:
          type: string
          title: Policy Set Version
        canonical_schema_version:
          type: string
          title: Canonical Schema Version
        seed:
          type: integer
          title: Seed
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - scenario_id
      - scenario_version
      - policy_set_version
      - canonical_schema_version
      - seed
      - created_at
      title: ScenarioMetadataResponse
    ScenarioReferenceResponse:
      properties:
        id:
          type: string
          title: Id
        version:
          type: string
          title: Version
        policy_set_version:
          type: string
          title: Policy Set Version
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - policy_set_version
      title: ScenarioReferenceResponse
    SendConversationMessageRequest:
      properties:
        message:
          type: string
          maxLength: 4000
          minLength: 1
          title: Message
      additionalProperties: false
      type: object
      required:
      - message
      title: SendConversationMessageRequest
    StartConversationRequest:
      properties:
        scenario_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Scenario Id
        scenario_version:
          type: string
          maxLength: 64
          minLength: 2
          pattern: ^v[1-9][0-9]*$
          title: Scenario Version
        seed:
          type: integer
          maximum: 4294967295.0
          minimum: 0.0
          title: Seed
        framework_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Framework Id
      additionalProperties: false
      type: object
      required:
      - scenario_id
      - scenario_version
      - seed
      - framework_id
      title: StartConversationRequest
    StructuredSupportResultResponse:
      properties:
        summary:
          type: string
          title: Summary
        customer_id:
          type: string
          format: uuid
          title: Customer Id
        product_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Product Ids
        order_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Order Ids
      additionalProperties: false
      type: object
      required:
      - summary
      - customer_id
      - product_ids
      - order_ids
      title: StructuredSupportResultResponse
    ToolActivityResponse:
      properties:
        tool_name:
          type: string
          title: Tool Name
        tool_version:
          type: string
          title: Tool Version
        outcome:
          type: string
          title: Outcome
        result:
          additionalProperties: true
          type: object
          title: Result
      additionalProperties: false
      type: object
      required:
      - tool_name
      - tool_version
      - outcome
      - result
      title: ToolActivityResponse
    ValidationIssue:
      properties:
        location:
          type: string
          title: Location
        message:
          type: string
          title: Message
        type:
          type: string
          title: Type
      additionalProperties: false
      type: object
      required:
      - location
      - message
      - type
      title: ValidationIssue
