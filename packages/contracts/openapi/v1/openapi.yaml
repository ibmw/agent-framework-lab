components:
  schemas:
    AccountFactsSchema:
      properties:
        customer_since:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Customer Since
        status:
          $ref: '#/components/schemas/AccountStatus'
        loyalty_tier:
          $ref: '#/components/schemas/LoyaltyTier'
        marketing_opt_in:
          type: boolean
          title: Marketing Opt In
        notes:
          type: string
          maxLength: 4000
          title: Notes
      additionalProperties: false
      type: object
      required:
      - customer_since
      - status
      - loyalty_tier
      - marketing_opt_in
      - notes
      title: AccountFactsSchema
    AccountStatus:
      type: string
      enum:
      - active
      - dormant
      - closed
      title: AccountStatus
    ActionProposalResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        session_id:
          type: string
          format: uuid
          title: Session Id
        action_type:
          type: string
          const: cancel_order
          title: Action Type
        tool_name:
          type: string
          const: cancel_order
          title: Tool Name
        tool_version:
          type: string
          const: v1
          title: Tool Version
        order_id:
          type: string
          format: uuid
          title: Order Id
        expected_version:
          type: integer
          title: Expected Version
        summary:
          type: string
          title: Summary
        confirmation_token:
          type: string
          title: Confirmation Token
        status:
          type: string
          enum:
          - proposed
          - confirmed
          - cancelled
          - executed
          title: Status
        attempts:
          type: integer
          title: Attempts
        result_order_status:
          anyOf:
          - type: string
            const: cancelled
          - type: 'null'
          title: Result Order Status
        result_order_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Result Order Version
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - action_type
      - tool_name
      - tool_version
      - order_id
      - expected_version
      - summary
      - confirmation_token
      - status
      - attempts
      - result_order_status
      - result_order_version
      title: ActionProposalResponse
    AddressSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        line1:
          type: string
          maxLength: 200
          minLength: 1
          title: Line1
        line2:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Line2
        postal_code:
          type: string
          maxLength: 200
          minLength: 1
          title: Postal Code
        city:
          type: string
          maxLength: 200
          minLength: 1
          title: City
        region:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Region
        country:
          type: string
          pattern: ^[A-Z]{2}$
          title: Country
        is_default:
          type: boolean
          title: Is Default
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - recipient
      - line1
      - line2
      - postal_code
      - city
      - region
      - country
      - is_default
      title: AddressSchema
    AgentFrameworkListResponse:
      properties:
        frameworks:
          items:
            $ref: '#/components/schemas/AgentFrameworkResponse'
          type: array
          title: Frameworks
      additionalProperties: false
      type: object
      required:
      - frameworks
      title: AgentFrameworkListResponse
    AgentFrameworkResponse:
      properties:
        framework_id:
          type: string
          title: Framework Id
        available:
          type: boolean
          title: Available
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
        unavailability_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Unavailability Reason
      additionalProperties: false
      type: object
      required:
      - framework_id
      - available
      - model_id
      - capabilities
      title: AgentFrameworkResponse
    AttachCustomerProfileRequest:
      properties:
        shop_id:
          type: string
          format: uuid
          title: Shop Id
      additionalProperties: false
      type: object
      required:
      - shop_id
      title: AttachCustomerProfileRequest
    AttributeSchema:
      properties:
        key:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Key
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        attribute_type:
          $ref: '#/components/schemas/AttributeType'
        value:
          type: string
          maxLength: 200
          minLength: 1
          title: Value
        unit:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Unit
        choices:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Choices
      additionalProperties: false
      type: object
      required:
      - key
      - label
      - attribute_type
      - value
      - unit
      - choices
      title: AttributeSchema
    AttributeType:
      type: string
      enum:
      - text
      - number
      - boolean
      - choice
      - measurement
      title: AttributeType
      description: The first bounded set of author-defined typed attributes.
    BackgroundEntrySchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        kind:
          $ref: '#/components/schemas/BackgroundKind'
        occurred_on:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Occurred On
        note:
          type: string
          maxLength: 4000
          minLength: 1
          title: Note
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - occurred_on
      - note
      title: BackgroundEntrySchema
    BackgroundKind:
      type: string
      enum:
      - purchase
      - support_contact
      - account_event
      - life_event
      title: BackgroundKind
      description: What a piece of authored pre-sandbox history is about.
    BlockListResponse:
      properties:
        blocks:
          items:
            $ref: '#/components/schemas/BlockSummarySchema'
          type: array
          title: Blocks
      additionalProperties: false
      type: object
      required:
      - blocks
      title: BlockListResponse
    BlockParameterKind:
      type: string
      enum:
      - document_reference
      - entity_reference
      - data_reference
      - tool_reference
      - severity
      - timing
      - duration
      - text
      title: BlockParameterKind
      description: 'What a scenario must supply for one parameter.


        A closed enumeration, extended in code: the scenario editor offers a picker
        per kind and

        the runtime resolves a binding by kind, so a kind that does not exist here
        can never be

        bound to anything.'
    BlockParameterSchema:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
          title: Name
        kind:
          $ref: '#/components/schemas/BlockParameterKind'
        description:
          type: string
          maxLength: 4000
          title: Description
        required:
          type: boolean
          title: Required
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
        shop_bound:
          type: boolean
          title: Shop Bound
          default: false
      additionalProperties: false
      type: object
      required:
      - name
      - kind
      - description
      - required
      - default
      title: BlockParameterSchema
    BlockSummarySchema:
      properties:
        block_id:
          type: string
          format: uuid
          title: Block Id
        name:
          type: string
          title: Name
        statement:
          type: string
          title: Statement
        type_label:
          type: string
          title: Type Label
        parameter_count:
          type: integer
          title: Parameter Count
        shop_bound_parameter_count:
          type: integer
          title: Shop Bound Parameter Count
        updated_at:
          type: string
          title: Updated At
        latest_published_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latest Published Version
        published_version_count:
          type: integer
          title: Published Version Count
      additionalProperties: false
      type: object
      required:
      - block_id
      - name
      - statement
      - type_label
      - parameter_count
      - shop_bound_parameter_count
      - updated_at
      - latest_published_version
      - published_version_count
      title: BlockSummarySchema
    BlockVersionListResponse:
      properties:
        versions:
          items:
            $ref: '#/components/schemas/DefinitionVersionSummarySchema'
          type: array
          title: Versions
      additionalProperties: false
      type: object
      required:
      - versions
      title: BlockVersionListResponse
    BoundMutationSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
        block_id:
          type: string
          format: uuid
          title: Block Id
        bindings:
          items:
            $ref: '#/components/schemas/ScenarioBindingSchema'
          type: array
          maxItems: 8
          title: Bindings
      additionalProperties: false
      type: object
      required:
      - id
      - block_id
      - bindings
      title: BoundMutationSchema
      description: One mutation template bound to this shop's objects. Its moment
        is a binding.
    BoundObjectiveSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Id
