      - attempt
      - after_calls
      - revision_before
      - revision_after
      - state_fingerprint
      - created_at
      title: MutationEventSchema
      description: 'One scenario fault that fired into one arm, and what it did to
        that arm.


        No agent asked for this and no agent can see it (ADR 0017): it is the scenario''s
        own

        fault arriving at the moment the recipe bound it to. It is served because
        an *operator*

        has to be able to explain what the arm met — a write refused as too late,
        with no visible

        cause, is the one thing a fault must never look like.


        `after_calls` is how many calls the attempt had already made when it fired,
        which is what

        places it between two of the agent''s calls rather than merely inside the
        same turn.


        `revision_before` and `revision_after` are the state change, recorded the
        way a tool

        event records one. There is no copy of what changed: the arm''s own state
        is the world

        afterwards, and a second description could disagree with it.'
