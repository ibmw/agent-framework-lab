            linked turn; naming one is a reply that arm alone received.
        message:
          type: string
          maxLength: 4000
          title: Message
          default: ''
      additionalProperties: false
      type: object
      required:
      - run_ids
      title: ParticipantTurnRequest
      description: 'One composition and the arms it reaches.


        `message` is what a human operator wrote. It is optional in the schema and
        required by

        the driver that needs it, deliberately: the field belongs to the human implementation,

        and a future generating driver will refuse a request that carries one rather
        than having

        the contract change shape underneath it.'
