      - tool_events
      - mutation_events
      title: RunTurnResponse
      description: 'What advancing one arm produced: the attempt, its calls, and the
        faults it met.


        `mutation_events` is empty for almost every advance and is the whole explanation
        when it

        is not: the scenario moved this arm''s world while the agent was working.'
